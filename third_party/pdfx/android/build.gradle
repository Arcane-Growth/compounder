group 'io.scer.pdf_renderer'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 9 can run with or without built-in Kotlin, so inspect the consuming
// app's explicit setting instead of inferring the mode from the AGP version.
def builtInKotlinEnabled = (project.findProperty('android.builtInKotlin') ?: 'false')
        .toString()
        .toBoolean()

apply plugin: 'com.android.library'
// Applied via pluginManager rather than `apply plugin:` so that Flutter's
// static "plugin applies KGP" detection, which pattern-matches build file
// text and cannot see this guard, does not flag the plugin.
if (!builtInKotlinEnabled) {
    pluginManager.apply('kotlin-android')
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'io.scer.pdf_renderer'
    }

    compileSdk 35

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 16
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    if (!builtInKotlinEnabled) {
        kotlinOptions {
            jvmTarget = '11'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
}
