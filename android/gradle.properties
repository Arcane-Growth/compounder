org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (AGP 9) instead of the legacy Kotlin Gradle Plugin.
# Flutter is removing KGP support and AGP 10 drops the compatibility path.
android.builtInKotlin=true

# Older plugins (e.g. flutter_timezone) set inconsistent JVM targets
kotlin.jvm.target.validation.mode=warning

# R8 full mode is the AGP 9 default. Stated explicitly so a future AGP change
# cannot silently downgrade the release build to compatibility mode, which
# would keep more code than proguard-rules.pro accounts for.
android.enableR8.fullMode=true
