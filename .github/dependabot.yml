version: 2

# Dependabot keeps the dependency surface current without letting it drift
# silently. Security advisories are raised regardless of this schedule.
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "pub"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Routine minor/patch bumps arrive as one reviewable PR; majors stay
      # separate because they need a human decision.
      flutter-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  # AGP, Kotlin, desugaring and the Gradle wrapper are real dependencies with
  # their own advisories; without this entry they are invisible to Dependabot.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor/patch bumps arrive together; AGP and Kotlin majors stay separate
      # because they need a human decision and a build.
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
