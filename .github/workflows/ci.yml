name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # The DST regression guards (test/dst_day_windows_test.dart,
        # test/digest_dst_test.dart) assert on ambient-zone DST transitions and
        # fail loudly rather than passing vacuously when the runner has none.
        # GitHub's ubuntu runner is UTC, so pin the zone.
        env:
          TZ: America/New_York
        run: flutter test
