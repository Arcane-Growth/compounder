name: compounder
description: "Compounder — compound your health, wealth and mind. Open source, private, bring-your-own-AI."
publish_to: "none"
version: 0.3.2+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  http: ^1.2.2
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.1
  intl: ^0.20.2
  gpt_markdown: ^1.2.1
  pdfx: ^2.11.0
  health: ^13.3.2
  permission_handler: ^12.0.1
  # Compounder AI subscription. in_app_purchase is the Flutter team's
  # Play Billing / StoreKit wrapper; the two platform packages are pulled in
  # transitively but pinned here so the Android (Billing 9.x) and iOS
  # (StoreKit 2) implementations are explicit.
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  in_app_purchase_storekit: ^0.4.17
  # The gateway API key is a bearer credential, so it is kept in the Android
  # Keystore-backed encrypted store rather than plaintext SharedPreferences
  # (the BYO token predates this and stays where it is).
  flutter_secure_storage: ^11.2.0
  # "Manage subscription" opens the store's subscription page; there is no
  # in-app billing UI for cancelling.
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1

# health 13.3.2 and pdfx 2.11.0 still apply the Kotlin Gradle Plugin
# unconditionally in their published Android build scripts, which Flutter
# flags as a deprecation. The copies under third_party/ are the published
# packages with exactly one change: android/build.gradle applies
# kotlin-android through pluginManager.apply behind an
# `android.builtInKotlin` guard instead of `apply plugin:`, so they build with
# AGP 9 built-in Kotlin. Everything else is upstream — verified by diffing
# against the pub.dev archives (health 13.3.2 sha256
# 8dd9625c9c26379a5753ad24c33af1d3dc5ce1f36f19c03e17c676c2f8fdbb80,
# pdfx 2.11.0 sha256
# 83bcd2b971fc2f6ee4299659c96d7d66b2ba4807748571a8a4889f1cde14b754);
# only the `example/` directories are omitted. The UUID-returning write APIs
# (writeHealthDataUUID/writeWorkoutDataUUID) are upstream 13.3.2, not local
# additions.
#
# Upstream commits the vendored trees were taken from:
#   health 13.3.2 — carp-dk/carp-health-flutter d90dbb717f04dac7111ae30692ce396cd9779bd4
#   pdfx 2.11.0   — ScerIO/packages.flutter 452979e49fa00df9d964422ff1bc9f1f6b122d16
# Drop these overrides once upstream ships the same fix.
dependency_overrides:
  health:
    path: third_party/health
  pdfx:
    path: third_party/pdfx

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
    # Workout cues, generated by tool/gen_rest_sounds.py (offline, no
    # network at runtime).
    - assets/sounds/rest_tick.wav
    - assets/sounds/rest_go.wav
    - assets/sounds/pr_fanfare.wav
