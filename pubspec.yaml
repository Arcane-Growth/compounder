name: compounder
description: "Compounder — compound your health, wealth and mind. Open source, private, bring-your-own-AI."
publish_to: "none"
version: 0.3.2+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  http: ^1.2.2
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.1
  intl: ^0.20.2
  gpt_markdown: ^1.2.1
  pdfx: ^2.11.0
  health: ^13.3.2
  permission_handler: ^12.0.1

# health 13.3.2 and pdfx 2.11.0 still apply the Kotlin Gradle Plugin
# unconditionally in their published Android build scripts, which Flutter
# flags as a deprecation. The copies under third_party/ are byte-identical
# apart from that guard (pluginManager.apply instead of apply plugin:), so
# they build with AGP 9 built-in Kotlin. Drop these overrides once upstream
# ships the same fix.
dependency_overrides:
  health:
    path: third_party/health
  pdfx:
    path: third_party/pdfx

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
